<footer class="site-footer" role="contentinfo">
  <div class="site-wrapper">
    <div class="footer-console">
      <div>
        <p class="footer-title">Transmission open</p>
        <p class="footer-copy">
          Writing about games, bots, AI systems, and whatever side quest is taking over the lab this week.
        </p>
      </div>

      <div>
        <div class="footer-links">
          <a href="{{ '/' | relative_url }}" class="nav-tab">Archive</a>
          <a href="{{ '/about/' | relative_url }}" class="nav-tab">About</a>
          {%- if site.github_username -%}
          <a href="https://github.com/{{ site.github_username }}" class="nav-tab" target="_blank" rel="noopener">GitHub</a>
          {%- endif -%}
        </div>
        <p class="footer-meta">
          &copy; {{ site.time | date: '%Y' }} {{ site.author | default: site.title }} · Built with
          <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a>
        </p>
      </div>
    </div>
  </div>
</footer>
