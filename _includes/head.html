<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

{%- assign page_title = page.title | default: site.title -%}
{%- assign page_desc  = page.description | default: page.excerpt | default: site.description -%}

<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page_desc | strip_html | truncate: 160 }}">

<!-- Open Graph -->
<meta property="og:title"       content="{{ page_title }}">
<meta property="og:description" content="{{ page_desc | strip_html | truncate: 200 }}">
<meta property="og:type"        content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url"         content="{{ page.url | absolute_url }}">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2307030f'/%3E%3Crect x='8' y='8' width='48' height='48' rx='6' fill='%23171333' stroke='%2351d6ff' stroke-width='4'/%3E%3Crect x='18' y='18' width='10' height='10' fill='%23ff56c1'/%3E%3Crect x='36' y='18' width='10' height='10' fill='%23ffd36e'/%3E%3Crect x='18' y='36' width='28' height='10' fill='%23abff78'/%3E%3C/svg%3E">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">

<!-- Theme stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

{% seo %}
{% feed_meta %}
