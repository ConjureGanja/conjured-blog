<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

{%- assign page_title = page.title | default: site.title -%}
{%- assign page_desc  = page.description | default: page.excerpt | default: site.description -%}

<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page_desc | strip_html | truncate: 160 }}">

<!-- Open Graph -->
<meta property="og:title"       content="{{ page_title }}">
<meta property="og:description" content="{{ page_desc | strip_html | truncate: 200 }}">
<meta property="og:type"        content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url"         content="{{ page.url | absolute_url }}">

<!-- OSRS Pixel Favicon (sword emoji via SVG) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23160900'/%3E%3Crect x='14' y='2' width='4' height='20' fill='%23c8a035'/%3E%3Crect x='8' y='12' width='16' height='4' fill='%23c8a035'/%3E%3Crect x='14' y='22' width='4' height='8' fill='%238b6520'/%3E%3Crect x='13' y='21' width='6' height='3' fill='%23e8c050'/%3E%3C/svg%3E">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<!-- Theme stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

{% seo %}
{% feed_meta %}
