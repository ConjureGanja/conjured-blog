<header class="site-header" role="banner">
  <div class="site-wrapper">
    <div class="top-status-bar" aria-label="Site status">
      <span class="status-pill">Online</span>
      <span class="status-copy">Gaming × automation × AI systems × project logs</span>
    </div>

    <div class="brand-console">
      <div class="brand-copy">
        <p class="brand-kicker">Retro dev log</p>
        <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
        <p class="site-tagline">{{ site.description }}</p>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"
             class="nav-tab{% if page.url == '/' %} active{% endif %}"
             aria-current="{% if page.url == '/' %}page{% endif %}">
            Home
          </a>
          <a href="{{ '/about/' | relative_url }}"
             class="nav-tab{% if page.url == '/about/' %} active{% endif %}"
             aria-current="{% if page.url == '/about/' %}page{% endif %}">
            About
          </a>
          {%- if site.github_username -%}
          <a href="https://github.com/{{ site.github_username }}"
             class="nav-tab"
             target="_blank" rel="noopener">
            GitHub
          </a>
          {%- endif -%}
        </nav>
      </div>

      <div class="brand-side">
        <div class="status-grid" aria-label="Site highlights">
          <div class="status-card">
            <span class="status-label">Posts</span>
            <span class="status-value">{{ site.posts | size }}</span>
          </div>
          <div class="status-card">
            <span class="status-label">Mode</span>
            <span class="status-value">Neon</span>
          </div>
        </div>

        <ul class="signal-list" aria-label="Topics covered">
          <li><span>Gaming</span><span>Live</span></li>
          <li><span>Automation</span><span>Active</span></li>
          <li><span>AI Systems</span><span>Queued</span></li>
          <li><span>Personal Builds</span><span>Always</span></li>
        </ul>
      </div>
    </div>
  </div>
</header>
